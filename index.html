<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- PWA (Ilova sifatida o'rnatish) uchun manifest va sozlamalar -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cyber%20Cloud%20Pro%22%2C%22short_name%22%3A%22CloudPro%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030712%22%2C%22theme_color%22%3A%22%2322c55e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Ffluency%2F96%2Fsecurity-checked.png%22%2C%22sizes%22%3A%2296x96%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

</head>
<body class="bg-gray-950 text-gray-100 font-['Fira_Code'] min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-900 border border-green-500/30 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-xl font-bold text-green-400 mb-4 text-center">Cyber Cloud Pro</h1>
        <p class="text-xs text-gray-400 mb-6 text-center">Fayllarni shifrlab to'g'ridan-to'g'ri Telegram kanalga yuborish</p>

        <!-- Fayl yuklash tugmasi -->
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-green-500/50 rounded-xl p-6 cursor-pointer hover:bg-green-500/10 transition">
            <i class="fa-solid fa-cloud-arrow-up text-3xl text-green-400 mb-2"></i>
            <span class="text-sm text-green-300 font-semibold">Fayl tanlash uchun bosing</span>
            <input type="file" id="file-input" class="hidden">
        </label>
    </div>

    <script>
        // Telegramga fayl yuborish funksiyasi
        async function sendFileToTelegram(file) {
            const BOT_TOKEN = '8592702862:AAE5zRdpFRb8PAbLwvkIaGuwXdWt_3EeLIo';
            const CHAT_ID = '-1003995950313';

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file);
            formData.append('caption', `Veb-ilovadan yuklandi: ${file.name}`);

            try {
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                let result = await response.json();
                if (result.ok) {
                    alert("Fayl muvaffaqiyatli Telegram botga yuborildi!");
                } else {
                    alert("Telegramga yuborishda xatolik: " + result.description);
                }
            } catch (err) {
                alert("Tarmoq xatosi: " + err.message);
            }
        }

        // Fayl tanlanganda avtomatik ishga tushishi
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('file-input');
            if (fileInput) {
                fileInput.addEventListener('change', (event) => {
                    const files = event.target.files;
                    if (files.length > 0) {
                        for (let i = 0; i < files.length; i++) {
                            sendFileToTelegram(files[i]);
                        }
                    }
                });
            }
        });
    </script>
</body>

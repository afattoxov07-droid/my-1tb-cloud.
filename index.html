<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[CYBER SECURE CLOUD PRO - KIRISH]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cyber%20Cloud%20Pro%22%2C%22short_name%22%3A%22CloudPro%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030712%22%2C%22theme_color%22%3A%22%2322c55e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Ffluency%2F96%2Fsecurity-checked.png%22%2C%22sizes%22%3A%2296x96%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cyber Cloud">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .glass { background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(34, 197, 94, 0.25); }
        .input-box { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(34, 197, 94, 0.2); }
        .input-box:focus { border-color: rgba(34, 197, 94, 0.8); outline: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(3, 7, 18, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(34, 197, 94, 0.3); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-green-400 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LOGIN CONTAINER -->
    <div id="loginSection" class="w-full max-w-md flex flex-col gap-4">
        <div class="glass p-6 rounded-2xl shadow-2xl flex flex-col items-center text-center">
            <div class="w-12 h-12 rounded-xl bg-slate-900 border border-green-500/40 flex items-center justify-center text-green-400 text-xl mb-3 shadow-lg shadow-green-900/20">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wider text-green-400">CYBER SECURE CLOUD PRO</h1>
            <p class="text-[11px] text-slate-400 mt-1 mb-5">Mijoz va Admin Kirish Portali</p>

            <div class="w-full flex flex-col gap-3">
                <input type="text" id="userName" placeholder="Ismingizni kiriting" class="input-box w-full rounded-xl p-3 text-xs text-green-300 text-center placeholder-slate-500">
                <input type="tel" id="userPhone" placeholder="+98 XX XXX XX XX" class="input-box w-full rounded-xl p-3 text-xs text-green-300 text-center placeholder-slate-500">
                <input type="password" id="userPassword" placeholder="O'zingizga parol o'rnating" class="input-box w-full rounded-xl p-3 text-xs text-green-300 text-center placeholder-slate-500">
                
                <button onclick="handleLogin()" class="w-full bg-green-600 hover:bg-green-500 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-green-600/20 text-xs tracking-wider mt-2">
                    PROFILGA KIRISH / OCHISH
                </button>
            </div>
        </div>

        <div class="glass p-5 rounded-2xl shadow-xl flex flex-col gap-3">
            <div class="flex justify-between items-center text-xs px-1">
                <span class="text-green-400 font-bold">> Ochiq Bo'limlar</span>
                <span class="text-[10px] text-amber-400 font-semibold">Erkin kirish</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="openModal('Tariflar', 'Hozircha barcha shaxsiy bulut imkoniyatlari mutlaqo bepul va cheklovsiz!')" class="input-box p-3 rounded-xl text-left hover:border-green-500 transition flex items-center gap-2 text-xs text-green-400">
                    <i class="fa-solid fa-tag text-[10px]"></i> Tariflar
                </button>
                <button onclick="openModal('Qoidalar', '1. Maxfiy kalitni yo\'qotmang.\n2. Fayllar faqat sizning shifringiz ostida shaxsiy bulutda saqlanadi.')" class="input-box p-3 rounded-xl text-left hover:border-green-500 transition flex items-center gap-2 text-xs text-green-400">
                    <i class="fa-solid fa-book text-[10px]"></i> Qoidalar
                </button>
            </div>

            <button onclick="openModal('Yordam', 'Savollar bo\'yicha admin bilan bog\'laning: @Admin')" class="input-box w-full p-3 rounded-xl flex justify-between items-center text-xs hover:border-green-500 transition text-green-400">
                <span class="flex items-center gap-2"><i class="fa-solid fa-headset"></i> Yordam va Qo'llab-quvvatlash</span>
                <span class="text-[10px] text-amber-400 font-bold">Online</span>
            </button>

            <button onclick="openModal('Loyiha haqida', 'Cyber Secure Cloud Pro - xotirada iz qoldirmaydigan shifrlangan shaxsiy bulut tizimi.')" class="w-full bg-slate-900 border border-cyan-800/40 hover:border-cyan-500 p-3 rounded-xl flex justify-between items-center text-xs transition text-cyan-300">
                <span class="flex items-center gap-2"><i class="fa-solid fa-circle-info"></i> Muallif va Loyiha Haqida</span>
                <span class="text-[10px] text-cyan-400 font-bold">Ma'lumot</span>
            </button>
        </div>
    </div>

    <!-- MAIN APP PANEL (HIDDEN UNTIL LOGIN) -->
    <div id="appSection" class="w-full max-w-md glass p-6 rounded-3xl shadow-2xl hidden flex-col gap-5">
        
        <!-- Header Profile Info -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-green-500/10 border border-green-500/30 flex items-center justify-center text-green-400 text-sm">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h2 class="text-xs font-bold tracking-wide text-green-400">CYBER CLOUD PRO</h2>
                    <p id="welcomeUser" class="text-[10px] text-slate-400 mt-0.5">Foydalanuvchi</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-[11px] text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-right-from-bracket"></i> Chiqish
            </button>
        </div>

        <!-- Secret Key Input -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] text-slate-300 flex items-center gap-1.5 font-medium">
                <i class="fa-solid fa-key text-green-400"></i> Maxfiy Shifrlash Kaliti (Secret Key)
            </label>
            <input type="password" id="secretKey" placeholder="Kalit so'zni kiriting..." class="input-box rounded-xl p-3 text-xs text-green-300">
        </div>

        <!-- Drop Zone -->
        <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-green-500/80 rounded-2xl p-5 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-2 bg-slate-900/40 hover:bg-slate-900/70 group">
            <div class="w-10 h-10 rounded-full bg-green-500/10 flex items-center justify-center text-green-400 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
            </div>
            <span class="text-xs font-medium text-slate-200">Faylni shu yerga tashlang yoki tanlang</span>
            <span class="text-[10px] text-slate-500">(Xotirada qolmaydi, to'g'ridan-to'g'ri bulutga shifrlanadi)</span>
            <input type="file" id="fileInput" class="hidden">
        </div>

        <!-- Progress Bar (Chiroyli shaklda) -->
        <div id="progressContainer" class="hidden flex flex-col gap-2 bg-slate-900/60 p-3.5 rounded-xl border border-slate-800">
            <div class="flex justify-between items-center text-[11px]">
                <span id="statusText" class="text-green-400 font-medium">Shifrlanmoqda...</span>
                <span id="progressPercent" class="text-slate-400 font-bold">0%</span>
            </div>
            <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800">
                <div id="progressBar" class="bg-gradient-to-r from-green-600 to-green-400 h-full w-0 transition-all duration-150 rounded-full"></div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="uploadBtn" class="w-full bg-green-600 hover:bg-green-500 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-green-600/20 text-xs flex items-center justify-center gap-2 active:scale-[0.98]">
            <i class="fa-solid fa-lock"></i> Shifrlash va Bulutga yuborish
        </button>

        <!-- Files List Section -->
        <div class="flex flex-col gap-2 pt-2 border-t border-slate-800/80">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-open text-green-400"></i> Mening fayllarim
                </span>
                <button id="refreshFilesBtn" class="text-[11px] text-green-400 hover:text-green-300 bg-green-500/10 hover:bg-green-500/20 px-2.5 py-1 rounded-lg transition flex items-center gap-1 font-medium">
                    <i class="fa-solid fa-rotate"></i> Yangilash
                </button>
            </div>
            <div id="filesList" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                <span class="text-[11px] text-slate-500 text-center py-4 bg-slate-900/30 rounded-xl border border-slate-900">Kalitni kiriting va ro'yxatni yangilang</span>
            </div>
        </div>
        
    </div>

    <!-- MODAL POPUP -->
    <div id="infoModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass max-w-sm w-full p-6 rounded-2xl flex flex-col gap-3 text-center border border-green-500/40 shadow-2xl">
            <h3 id="modalTitle" class="text-sm font-bold text-green-400"></h3>
            <p id="modalText" class="text-xs text-slate-300 whitespace-pre-line leading-relaxed"></p>
            <button onclick="closeModal()" class="bg-green-600 hover:bg-green-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs mt-2">Tushunarli</button>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8997903805:AAHeQFkI3rcdRv7azBH5WhjMqBwDU8DTE3s";
        const CHAT_ID = "8866709686";

        function handleLogin() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const pass = document.getElementById('userPassword').value.trim();

            if(!name || !phone || !pass) {
                alert('Iltimos, barcha maydonlarni to\'ldiring!');
                return;
            }

            document.getElementById('welcomeUser').innerText = `${name} (${phone})`;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('flex');
        }

        function handleLogout() {
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('flex');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalText').innerText = text;
            document.getElementById('infoModal').classList.remove('hidden');
            document.getElementById('infoModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
            document.getElementById('infoModal').classList.remove('flex');
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const filesList = document.getElementById('filesList');
        const refreshFilesBtn = document.getElementById('refreshFilesBtn');

        dropZone.addEventListener('click', () => fileInput.click());

        uploadBtn.addEventListener('click', async () => {
            const secretKey = document.getElementById('secretKey').value.trim();
            const file = fileInput.files[0];

            if (!secretKey) {
                alert('Iltimos, Maxfiy kalitni kiriting!');
                return;
            }
            if (!file) {
                alert('Iltimos, yuborish uchun fayl tanlang!');
                return;
            }

            progressContainer.classList.remove('hidden');
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50');

            try {
                statusText.innerText = "Fayl o'qilmoqda va shifrlanmoqda...";
                progressPercent.innerText = "20%";
                progressBar.style.width = "20%";

                const arrayBuffer = await file.arrayBuffer();
                const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);

                progressPercent.innerText = "50%";
                progressBar.style.width = "50%";
                statusText.innerText = "AES-256 shifri bajarilmoqda...";

                const encrypted = CryptoJS.AES.encrypt(wordArray, secretKey).toString();

                progressPercent.innerText = "80%";
                progressBar.style.width = "80%";
                statusText.innerText = "Shaxsiy bulutga uzatilmoqda...";

                const encryptedBlob = new Blob([encrypted], { type: 'text/plain' });
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', encryptedBlob, file.name + '.enc');
                formData.append('caption', `🔐 Shifrlangan fayl: \`${file.name}\`\n🛡️ Algoritm: AES-256`);
                formData.append('parse_mode', 'Markdown');

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.ok) {
                    progressPercent.innerText = "100%";
                    progressBar.style.width = "100%";
                    statusText.innerText = "Muvaffaqiyatli qo'shildi!";
                    alert('Fayl muvaffaqiyatli shifrlanib, shaxsiy bulut tizimingizga qo\'shildi!');
                    fileInput.value = '';
                    loadUserFiles();
                } else {
                    throw new Error(result.description || 'Bulutga yuborishda xatolik yuz berdi.');
                }
            } catch (error) {
                alert('Xatolik: ' + error.message);
                statusText.innerText = "Xatolik yuz berdi!";
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-50');
            }
        });

        async function loadUserFiles() {
            const secretKey = document.getElementById('secretKey').value.trim();
            if (!secretKey) {
                filesList.innerHTML = `<span class="text-[11px] text-red-400 text-center py-3 bg-red-500/10 rounded-xl border border-red-500/20">Avval maxfiy kalitni kiriting!</span>`;
                return;
            }

            filesList.innerHTML = `<span class="text-[11px] text-slate-400 text-center py-4 bg-slate-900/30 rounded-xl border border-slate-900">Yuklanmoqda...</span>`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const data = await res.json();

                if (!data.ok) throw new Error("Shaxsiy bulutdan ma'lumotlarni o'qib bo'lmadi.");

                filesList.innerHTML = '';
                let foundFiles = false;

                for (let update of data.result.reverse()) {
                    if (update.message && update.message.document) {
                        const doc = update.message.document;
                        if (doc.file_name && doc.file_name.endsWith('.enc')) {
                            foundFiles = true;
                            
                            const fileRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${doc.file_id}`);
                            const fileData = await fileRes.json();

                            if (fileData.ok) {
                                const fileUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${fileData.result.file_path}`;
                                const originalName = doc.file_name.replace('.enc', '');

                                const item = document.createElement('div');
                                item.className = "flex items-center justify-between bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl text-xs hover:border-green-500/40 transition";
                                item.innerHTML = `
                                    <span class="truncate max-w-[170px] text-green-300 font-medium" title="${originalName}">
                                        <i class="fa-regular fa-file-lines text-slate-500 mr-1.5"></i>${originalName}
                                    </span>
                                    <button class="bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-slate-950 px-3 py-1.5 rounded-lg transition text-[10px] font-bold flex items-center gap-1" onclick="decryptAndDownload('${fileUrl}', '${originalName}')">
                                        <i class="fa-solid fa-download"></i> Ochish
                                    </button>
                                `;
                                filesList.appendChild(item);
                            }
                        }
                    }
                }

                if (!foundFiles) {
                    filesList.innerHTML = `<span class="text-[11px] text-slate-500 text-center py-4 bg-slate-900/30 rounded-xl border border-slate-900">Hozircha fayllar topilmadi.</span>`;
                }
            } catch (err) {
                filesList.innerHTML = `<span class="text-[11px] text-red-400 text-center py-3 bg-red-500/10 rounded-xl border border-red-500/20">Xatolik yuz berdi.</span>`;
            }
        }

        refreshFilesBtn.addEventListener('click', loadUserFiles);

        async function decryptAndDownload(url, fileName) {
            const secretKey = document.getElementById('secretKey').value.trim();
            if (!secretKey) {
                alert('Maxfiy kalit kiritilmagan!');
                return;
            }

            try {
                const res = await fetch(url);
                const encryptedText = await res.text();

                const bytes = CryptoJS.AES.decrypt(encryptedText, secretKey);
                const decryptedString = bytes.toString(CryptoJS.enc.Utf8);

                if (!decryptedString) {
                    throw new Error("Kalit noto'g'ri!");
                }

                const blob = new Blob([bytes.toString(CryptoJS.enc.Latin1)], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
            } catch (err) {
                alert('Xatolik: Kalit xato yoki faylni shifrdan yechib bo\'lmadi!');
            }
        }
    </script>
</body>
</html>

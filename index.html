<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin va Mijozlar Paneli - Firebase & Telegram</title>
    <!-- Firebase SDK skriptlari -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .panel { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tizimga Kirish</h2>
        <div id="login-section">
            <input type="text" id="username" placeholder="Login yoki Parol kiriting...">
            <button onclick="login()">Kirish</button>
        </div>
        <div id="dashboard" style="display:none;">
            <h3 id="welcome-text"></h3>
            
            <div id="admin-panel" class="panel" style="display:none;">
                <h4>Admin Boshqaruvi</h4>
                <p>Barcha ma'lumotlar Firebase Realtime Database dan yuklandi.</p>
                <div id="admin-stats"></div>
            </div>

            <div id="client-panel" class="panel" style="display:none;">
                <h4>Mijoz Kabineti</h4>
                <input type="file" id="fileInput">
                <button onclick="uploadFileToTelegram()">Faylni Telegramga yuborish</button>
            </div>
        </div>
    </div>

    <script>
        // --- FIREBASE SOZLAMALARI ---
        const firebaseConfig = {
            apiKey: "SIZNING_API_KEYINGIZ",
            authDomain: "SIZNING_PROYEKT.firebaseapp.com",
            databaseURL: "https://SIZNING_PROYEKT-default-rtdb.firebaseio.com",
            projectId: "SIZNING_PROYEKT",
            storageBucket: "SIZNING_PROYEKT.appspot.com",
            messagingSenderId: "SIZNING_SENDER_ID",
            appId: "SIZNING_APP_ID"
        };

        // Firebase ni ishga tushirish
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // --- TELEGRAM BOT SOZLAMALARI ---
        const BOT_TOKEN = "SIZNING_BOT_TOKENINGIZ";
        const CHAT_ID = "SIZNING_CHAT_IDINGIZ";

        // Seansni log qilish funksiyasi
        function logSession(name, role) {
            database.ref('sessions').once('value', (snapshot) => {
                let sessions = snapshot.val() || [];
                sessions.unshift({
                    name: name,
                    role: role,
                    device: navigator.userAgent.includes('Mobile') ? 'Mobil Qurilma' : 'Noutbuk / Desktop',
                    time: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString()
                });
                if (sessions.length > 10) sessions.pop();
                database.ref('sessions').set(sessions);
            });
        }

        // Tizimga kirish funksiyasi
        function login() {
            const val = document.getElementById('username').value.trim();
            if (!val) {
                alert("Iltimos, ma'lumot kiriting!");
                return;
            }

            // Adminlar bazasini tekshirish
            database.ref('admins').once('value', (adminSnap) => {
                let admins = adminSnap.val();
                if (!admins) {
                    admins = { "2007080411": { name: "Asosiy Admin" } };
                    database.ref('admins').set(admins);
                }

                if (admins[val]) {
                    showDashboard(admins[val].name, 'admin');
                    logSession(admins[val].name, 'Admin');
                    return;
                }

                // Mijozlar bazasini tekshirish
                database.ref('clients').once('value', (clientSnap) => {
                    let clients = clientSnap.val();
                    if (!clients) {
                        clients = { "parol123": { name: "Test_Mijoz", paid: false } };
                        database.ref('clients').set(clients);
                    }

                    if (clients[val]) {
                        showDashboard(clients[val].name, 'client');
                        logSession(clients[val].name, 'Mijoz');
                    } else {
                        alert("Xato login yoki parol!");
                    }
                });
            });
        }

        // Dashboardni ko'rsatish
        function showDashboard(name, role) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('welcome-text').innerText = `Xush kelibsiz, ${name}!`;

            if (role === 'admin') {
                document.getElementById('admin-panel').style.display = 'block';
            } else {
                document.getElementById('client-panel').style.display = 'block';
            }
        }

        // Telegram botga fayl yuklash
        async function uploadFileToTelegram() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                alert("Iltimos, fayl tanlang!");
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file);

            try {
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });
                let result = await response.json();
                if (result.ok) {
                    alert("Fayl muvaffaqiyatli Telegramga yuborildi!");
                } else {
                    alert("Xatolik yuz berdi: " + result.description);
                }
            } catch (e) {
                alert("Tarmoq xatoligi: " + e.message);
            }
        }
    </script>
</body>
</html>

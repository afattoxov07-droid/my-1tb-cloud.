<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[NEURAL-CLOUD 10B TB]</title>
    
    <!-- Single-file Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Neural Cloud 10B TB","short_name":"NeuralCloud","start_url":"/","display":"standalone","background_color":"#030712","theme_color":"#22c55e","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/6124/6124993.png","sizes":"512x512","type":"image/png"}]}'>
    <meta name="theme-color" content="#22c55e">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #030712; color: #22c55e; -webkit-text-size-adjust: 100%; }
        .scanline { background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3)); background-size: 100% 4px; }
        .cyber-border { border: 1px solid #15803d; box-shadow: 0 0 10px rgba(34, 197, 94, 0.15), inset 0 0 10px rgba(34, 197, 94, 0.1); }
        .cyber-card { background: rgba(6, 78, 59, 0.1); border: 1px solid #166534; transition: all 0.2s ease; }
        .cyber-card:active { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); }
        .cyber-button { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .cyber-button:active { background: #22c55e; color: #000; }
        .drag-active { border-color: #4ade80 !important; background: rgba(34, 197, 94, 0.25) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden text-sm md:text-base">
    <div class="pointer-events-none fixed inset-0 z-50 scanline opacity-30"></div>

    <!-- Header -->
    <header class="p-3 md:p-4 border-b border-green-800 bg-gray-950/90 flex justify-between items-center relative z-10 gap-2">
        <div class="flex items-center space-x-2 overflow-hidden">
            <span class="inline-block w-2.5 h-2.5 bg-green-500 rounded-full animate-ping shrink-0"></span>
            <h1 class="text-xs md:text-sm font-bold tracking-wider text-green-400 truncate">
                NEURAL_STORAGE_10B_TB
            </h1>
        </div>
        <div class="flex items-center space-x-2 shrink-0">
            <button id="install-btn" class="hidden cyber-button px-2.5 py-1.5 rounded text-xs font-bold animate-bounce flex items-center gap-1 cursor-pointer">
                <i class="fa-solid fa-download"></i> O'RNATISH
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 max-w-6xl w-full mx-auto p-3 md:p-6 flex flex-col gap-4 relative z-10">
        
        <!-- Top Section: Upload & Storage -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- Drop Zone (Takes 2 columns) -->
            <div class="md:col-span-2">
                <div id="drop-zone" class="cyber-card p-6 md:p-8 rounded-lg text-center cursor-pointer relative overflow-hidden flex flex-col items-center justify-center min-h-[160px]">
                    <input type="file" id="file-input" class="hidden" multiple>
                    <div class="space-y-3">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl md:text-4xl text-green-400"></i>
                        <div>
                            <h3 class="text-sm md:text-base font-bold text-green-300">FAYLLARNI YUKLASH</h3>
                            <p class="text-xs text-green-600 mt-1">[ Bosing yoki faylni tashlang ]</p>
                        </div>
                        <button onclick="document.getElementById('file-input').click()" class="cyber-button px-4 py-2 rounded text-xs font-bold uppercase">
                            + FAYL TANLASH
                        </button>
                    </div>
                </div>
            </div>

            <!-- Storage Info & Console -->
            <div class="space-y-4 flex flex-col">
                <div class="cyber-border bg-gray-950 p-3.5 rounded-lg space-y-2">
                    <div class="text-[11px] text-green-600 font-bold">XOTIRA HOLATI</div>
                    <div class="text-xl md:text-2xl font-bold text-green-400">10,000,000,000 TB</div>
                    <div class="w-full bg-gray-900 h-1.5 border border-green-800 overflow-hidden">
                        <div class="bg-green-500 h-full w-full animate-pulse"></div>
                    </div>
                    <p class="text-[10px] text-green-700">> Xavfsiz bulut (0 KB band)</p>
                </div>

                <div class="cyber-border bg-gray-950 p-3 rounded-lg flex flex-col flex-1 min-h-[120px]">
                    <div class="text-[10px] text-green-600 border-b border-green-900 pb-1 mb-1 flex justify-between">
                        <span>CONSOLE</span>
                        <span onclick="document.getElementById('terminal-log').innerHTML=''" class="cursor-pointer hover:text-green-300">[cls]</span>
                    </div>
                    <div id="terminal-log" class="text-[10px] space-y-0.5 overflow-y-auto max-h-24 text-green-500 font-mono">
                        <p class="text-green-700">> Tizim tayyor...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div id="progress-container" class="hidden cyber-border bg-gray-950 p-3 rounded-lg">
            <div class="flex justify-between text-xs mb-1">
                <span id="progress-title" class="truncate max-w-[200px] text-green-300">> YUKLANMOQDA...</span>
                <span id="progress-percent" class="text-green-400 font-bold">0%</span>
            </div>
            <div class="w-full bg-gray-900 h-2 border border-green-800">
                <div id="progress-bar" class="bg-green-500 h-full transition-all duration-200" style="width: 0%"></div>
            </div>
        </div>

        <!-- Files Section -->
        <div class="space-y-3">
            <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-2">
                <div class="text-xs font-bold text-green-400 flex items-center space-x-2">
                    <span>> YUKLANGAN_FAYLLAR</span>
                    <span id="file-count" class="px-2 py-0.5 bg-green-950 border border-green-800 rounded text-[10px]">0</span>
                </div>
                <input type="text" id="search-input" oninput="searchFiles()" placeholder="[ Qidirish... ]" class="bg-gray-950 border border-green-800 text-xs text-green-400 px-3 py-2 rounded focus:outline-none focus:border-green-400 w-full sm:w-48">
            </div>

            <div id="file-list" class="space-y-2"></div>
        </div>
    </div>

    <!-- Live Media Modal -->
    <div id="media-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-3">
        <div class="cyber-border bg-gray-950 p-4 rounded-lg max-w-lg w-full relative">
            <button onclick="closeModal()" class="absolute top-2 right-2 text-green-400 hover:text-green-200 text-sm font-bold p-2">[ X ]</button>
            <h4 id="modal-title" class="text-xs font-bold text-green-400 mb-3 truncate pr-8">> PREVIEW</h4>
            <div id="modal-content" class="flex justify-center items-center max-h-[60vh] overflow-hidden"></div>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8223970205:AAGeeh5B07eGGh39DqmMvswA_IBNr5L1apM';
        const CHAT_ID = '-1004345573571';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const progressTitle = document.getElementById('progress-title');
        const fileList = document.getElementById('file-list');
        const fileCount = document.getElementById('file-count');
        const terminalLog = document.getElementById('terminal-log');
        const installBtn = document.getElementById('install-btn');

        let deferredPrompt;
        let savedFiles = JSON.parse(localStorage.getItem('my_cloud_files') || '[]');
        renderFiles(savedFiles);

        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') log('Ilova o\'rnatildi!');
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            } else {
                alert("Brauzer menyusidan 'Bosh ekranga qo'shish' tugmasini bosing.");
            }
        });

        function log(msg) {
            const p = document.createElement('p');
            p.innerText = `> ${msg}`;
            terminalLog.appendChild(p);
            terminalLog.scrollTop = terminalLog.scrollHeight;
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles(fileInput.files); });

        async function handleFiles(files) {
            for (let file of files) await uploadToTelegram(file);
        }

        function uploadToTelegram(file) {
            return new Promise((resolve) => {
                log(`Yuklanmoqda: ${file.name}`);
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, true);
                progressContainer.classList.remove('hidden');
                progressTitle.innerText = `> ${file.name}`;

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressPercent.innerText = percent + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const res = JSON.parse(xhr.responseText);
                        if (res.ok) {
                            const fileData = {
                                id: res.result.document.file_id,
                                name: file.name,
                                type: file.type,
                                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                                date: new Date().toLocaleDateString()
                            };
                            savedFiles.unshift(fileData);
                            localStorage.setItem('my_cloud_files', JSON.stringify(savedFiles));
                            log(`Saqlandi: ${file.name}`);
                            renderFiles(savedFiles);
                        }
                    } else log(`Xatolik yuz berdi!`);
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                    resolve();
                };

                xhr.onerror = function() {
                    log(`Tarmoq xatosi!`);
                    progressContainer.classList.add('hidden');
                    resolve();
                };

                xhr.send(formData);
            });
        }

        async function previewFile(fileId, fileName, fileType) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) {
                    const downloadUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
                    const modal = document.getElementById('media-modal');
                    const modalContent = document.getElementById('modal-content');
                    document.getElementById('modal-title').innerText = `> ${fileName}`;
                    
                    if (fileType.startsWith('image/')) modalContent.innerHTML = `<img src="${downloadUrl}" class="max-h-[50vh] rounded border border-green-800">`;
                    else if (fileType.startsWith('video/')) modalContent.innerHTML = `<video src="${downloadUrl}" controls class="max-h-[50vh] w-full rounded border border-green-800"></video>`;
                    else modalContent.innerHTML = `<p class="text-xs text-green-500">Ko'rib bo'lmaydigan fayl turi.</p>`;
                    
                    modal.classList.remove('hidden');
                }
            } catch (err) { log(`Xatolik.`); }
        }

        function closeModal() {
            document.getElementById('media-modal').classList.add('hidden');
            document.getElementById('modal-content').innerHTML = '';
        }

        async function copyShareLink(fileId) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) {
                    navigator.clipboard.writeText(`https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`);
                    alert("Havola nusxalandi!");
                }
            } catch (err) { log("Havola xatosi."); }
        }

        async function downloadFile(fileId, fileName) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) {
                    const a = document.createElement('a');
                    a.href = `https://api.telegram.org/file/bot${BOT_TOKEN}/${data.result.file_path}`;
                    a.download = fileName;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            } catch (err) { log(`Yuklab bo'lmadi.`); }
        }

        function renderFiles(filesToRender) {
            fileCount.innerText = filesToRender.length;
            if (filesToRender.length === 0) {
                fileList.innerHTML = `<div class="text-center py-6 cyber-border bg-gray-950 text-xs text-green-700">> XOTIRA BO'SH</div>`;
                return;
            }
            fileList.innerHTML = filesToRender.map((file, index) => `
                <div class="cyber-card p-2.5 md:p-3 rounded flex items-center justify-between text-xs gap-2">
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <i class="fa-solid fa-file-code text-green-400 shrink-0"></i>
                        <div class="truncate">
                            <p class="font-bold text-green-300 truncate">${file.name}</p>
                            <p class="text-[10px] text-green-600">${file.size}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 shrink-0">
                        <button onclick="previewFile('${file.id}', '${file.name}', '${file.type || ''}')" class="cyber-button p-1.5 rounded text-[10px]"><i class="fa-solid fa-eye"></i></button>
                        <button onclick="copyShareLink('${file.id}')" class="cyber-button p-1.5 rounded text-[10px]"><i class="fa-solid fa-share-nodes"></i></button>
                        <button onclick="downloadFile('${file.id}', '${file.name}')" class="cyber-button p-1.5 rounded text-[10px]"><i class="fa-solid fa-download"></i></button>
                        <button onclick="deleteFile(${index})" class="p-1.5 bg-red-950/40 border border-red-800 text-red-400 rounded text-[10px]"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function searchFiles() {
            const query = document.getElementById('search-input').value.toLowerCase();
            renderFiles(savedFiles.filter(f => f.name.toLowerCase().includes(query)));
        }

        function deleteFile(index) {
            if (confirm("O'chirishni tasdiqlaysizmi?")) {
                savedFiles.splice(index, 1);
                localStorage.setItem('my_cloud_files', JSON.stringify(savedFiles));
                renderFiles(savedFiles);
            }
        }
    </script>
</body>
</html>

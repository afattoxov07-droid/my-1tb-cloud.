<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening 10.000 MLRD TB Bulutim - Cheksiz Telegram Xotirasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .drag-active { border-color: #3b82f6 !important; background-color: rgba(59, 130, 246, 0.1) !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid font-bold text-blue-500 text-2xl fa-cloud"></i>
            <h1 class="text-xl font-bold tracking-wide">10.000 MLRD TB Cloud <span class="text-xs bg-blue-600 text-white px-2 py-0.5 rounded-full ml-2">Telegram Storage</span></h1>
        </div>
        <div class="text-sm text-slate-400">
            Imkoniyat: <span class="text-green-400 font-semibold">Cheksiz (10.000 MLRD TB+)</span>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800/50 p-6 border-r border-slate-700 hidden md:block flex flex-col justify-between">
            <nav class="space-y-2">
                <a href="#" class="flex items-center space-x-3 bg-blue-600/20 text-blue-400 p-3 rounded-xl font-medium">
                    <i class="fa-solid fa-folder-open"></i>
                    <span>Barcha fayllar</span>
                </a>
            </nav>
            <div class="mt-10 bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 mb-2">Xotira holati:</p>
                <div class="w-full bg-slate-700 rounded-full h-2 mb-2">
                    <div class="bg-blue-500 h-2 rounded-full" style="width: 5%"></div>
                </div>
                <p class="text-xs text-slate-300 font-medium">Telegram ombori ulangan</p>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 p-6 md:p-10 max-w-5xl mx-auto">
            <!-- Upload Area -->
            <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-2xl p-8 text-center bg-slate-800/30 hover:border-blue-500 transition-all cursor-pointer relative mb-8">
                <input type="file" id="file-input" class="hidden" multiple>
                <i class="fa-solid fa-cloud-arrow-up text-5xl text-blue-400 mb-4"></i>
                <h3 class="text-lg font-semibold mb-1">Fayllarni bu yerga tashlang yoki tanlang</h3>
                <p class="text-sm text-slate-400">Noutbuk xotirasi band qilinmaydi (Cheksiz hajm)</p>
                <button onclick="document.getElementById('file-input').click()" class="mt-4 bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-blue-600/30">
                    <i class="fa-solid fa-plus mr-2"></i>Fayl yuklash
                </button>
            </div>

            <!-- Upload Progress -->
            <div id="progress-container" class="hidden mb-8 bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div class="flex justify-between text-sm mb-2">
                    <span id="progress-title" class="font-medium text-slate-200">Yuklanmoqda...</span>
                    <span id="progress-percent" class="text-blue-400 font-bold">0%</span>
                </div>
                <div class="w-full bg-slate-700 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <!-- File List -->
            <div>
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Yuklangan fayllar</h2>
                <div id="file-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Files will appear here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const BOT_TOKEN = '8223970205:AAGeeh5B07eGGh39DqmMvswA_IBNr5L1apM';
        const CHAT_ID = '-1004345573571';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const progressTitle = document.getElementById('progress-title');
        const fileList = document.getElementById('file-list');

        let savedFiles = JSON.parse(localStorage.getItem('my_cloud_files') || '[]');
        renderFiles();

        // Drag & Drop
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-active'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles(fileInput.files); });

        async function handleFiles(files) {
            for (let file of files) {
                await uploadToTelegram(file);
            }
        }

        function uploadToTelegram(file) {
            return new Promise((resolve) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, true);

                progressContainer.classList.remove('hidden');
                progressTitle.innerText = `${file.name} yuklanmoqda...`;

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = percent + '%';
                        progressPercent.innerText = percent + '%';
                    }
                };

                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const res = JSON.parse(xhr.responseText);
                        if (res.ok) {
                            const fileId = res.result.document.file_id;
                            const fileData = {
                                id: fileId,
                                name: file.name,
                                size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                                date: new Date().toLocaleDateString()
                            };
                            savedFiles.unshift(fileData);
                            localStorage.setItem('my_cloud_files', JSON.stringify(savedFiles));
                            renderFiles();
                        }
                    } else {
                        alert('Yuklashda xatolik yuz berdi!');
                    }
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                    resolve();
                };

                xhr.onerror = function() {
                    alert('Tarmoq xatosi bor.');
                    progressContainer.classList.add('hidden');
                    resolve();
                };

                xhr.send(formData);
            });
        }

        async function downloadFile(fileId, fileName) {
            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
                const data = await res.json();
                if (data.ok) {
                    const filePath = data.result.file_path;
                    const downloadUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${filePath}`;
                    
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = fileName;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert("Fayl yo'lini olishda xatolik yuz berdi.");
                }
            } catch (err) {
                alert("Yuklab olishda xatolik yuz berdi.");
            }
        }

        function renderFiles() {
            if (savedFiles.length === 0) {
                fileList.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">Hozircha fayllar yo'q</div>`;
                return;
            }

            fileList.innerHTML = savedFiles.map((file, index) => `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex items-center justify-between shadow-md">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <i class="fa-solid fa-file-lines text-2xl text-blue-400"></i>
                        <div class="truncate">
                            <p class="font-medium text-slate-200 truncate" title="${file.name}">${file.name}</p>
                            <p class="text-xs text-slate-400">${file.size} • ${file.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="downloadFile('${file.id}', '${file.name}')" title="Yuklab olish" class="text-blue-400 hover:text-blue-300 p-2">
                            <i class="fa-solid fa-download"></i>
                        </button>
                        <button onclick="deleteFile(${index})" title="O'chirish" class="text-red-400 hover:text-red-300 p-2">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function deleteFile(index) {
            if (confirm("Ushbu faylni ro'yxatdan o'chirmoqchimisiz?")) {
                savedFiles.splice(index, 1);
                localStorage.setItem('my_cloud_files', JSON.stringify(savedFiles));
                renderFiles();
            }
        }
    </script>
</body>
</html>

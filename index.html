<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[SECURE ENCRYPTED CYBER CLOUD PRO - TELEGRAM BOT]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- PWA (Ilova sifatida o'rnatish) uchun manifest va sozlamalar -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Cyber%20Cloud%20Pro%22%2C%22short_name%22%3A%22CloudPro%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23030712%22%2C%22theme_color%22%3A%22%2322c55e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fimg.icons8.com%2Ffluency%2F96%2Fsecurity-checked.png%22%2C%22sizes%22%3A%2296x96%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cyber Cloud">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .glass { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(34, 197, 94, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-green-400 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- HEADER -->
    <header class="w-full max-w-md glass p-4 rounded-xl shadow-lg shadow-green-900/20 text-center mb-4">
        <h1 class="text-xl font-bold tracking-wider text-green-400 flex items-center justify-center gap-2">
            <i class="fa-solid fa-shield-halved"></i> CYBER CLOUD PRO
        </h1>
        <p class="text-xs text-slate-400 mt-1">Telegram Bulut Shlyuzi • Nol Xotira</p>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-md glass p-5 rounded-2xl shadow-2xl flex flex-col gap-4">
        
        <!-- SECRET KEY INPUT -->
        <div class="flex flex-col gap-2">
            <label class="text-xs text-slate-400"><i class="fa-solid fa-key"></i> Maxfiy Shifrlash Kaliti (Secret Key)</label>
            <input type="password" id="secretKey" placeholder="Kalit so'zni kiriting..." class="bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-green-300 focus:outline-none focus:border-green-500">
        </div>

        <hr class="border-slate-800 my-1">

        <!-- FILE UPLOAD ZONE -->
        <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-green-500 rounded-xl p-6 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-2 bg-slate-900/50">
            <i class="fa-solid fa-cloud-arrow-up text-3xl text-green-500 mb-1"></i>
            <span class="text-xs text-slate-300">Faylni shu yerga tashlang yoki tanlang</span>
            <span class="text-[10px] text-slate-500">(To'g'ridan-to'g'ri shifrlanib Telegramga ketadi)</span>
            <input type="file" id="fileInput" class="hidden">
        </div>

        <!-- PROGRESS BAR -->
        <div id="progressContainer" class="hidden flex flex-col gap-1.5">
            <div class="flex justify-between text-xs text-slate-400">
                <span id="statusText">Shifrlanmoqda...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-150"></div>
            </div>
        </div>

        <!-- ACTION BUTTON -->
        <button id="uploadBtn" class="w-full bg-green-600 hover:bg-green-500 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-green-600/20 text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-lock"></i> Shifrlash va Telegramga yuborish
        </button>

        <hr class="border-slate-800 my-1">

        <!-- USER FILES LIST -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-slate-300"><i class="fa-solid fa-folder-open"></i> Mening fayllarim</span>
                <button id="refreshFilesBtn" class="text-[10px] text-green-400 hover:underline"><i class="fa-solid fa-rotate"></i> Yangilash</button>
            </div>
            <div id="filesList" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                <span class="text-[10px] text-slate-500 text-center py-3">Kalitni kiriting va ro'yxatni yangilang</span>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-4 text-[10px] text-slate-600 text-center">
        Cyber Cloud Pro &bull; Zero-Storage Architecture
    </footer>

    <script>
        const BOT_TOKEN = "8997903805:AAHeQFkI3rcdRv7azBH5WhjMqBwDU8DTE3s";
        const CHAT_ID = "8866709686";

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const filesList = document.getElementById('filesList');
        const refreshFilesBtn = document.getElementById('refreshFilesBtn');

        dropZone.addEventListener('click', () => fileInput.click());

        uploadBtn.addEventListener('click', async () => {
            const secretKey = document.getElementById('secretKey').value.trim();
            const file = fileInput.files[0];

            if (!secretKey) {
                alert('Iltimos, Maxfiy kalitni kiriting!');
                return;
            }

            if (!file) {
                alert('Iltimos, yuborish uchun fayl tanlang!');
                return;
            }

            progressContainer.classList.remove('hidden');
            uploadBtn.disabled = true;
            uploadBtn.classList.add('opacity-50');

            try {
                statusText.innerText = "Fayl o'qilmoqda va shifrlanmoqda...";
                progressPercent.innerText = "20%";
                progressBar.style.width = "20%";

                const arrayBuffer = await file.arrayBuffer();
                const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);

                progressPercent.innerText = "50%";
                progressBar.style.width = "50%";
                statusText.innerText = "AES-256 shifri bajarilmoqda...";

                const encrypted = CryptoJS.AES.encrypt(wordArray, secretKey).toString();

                progressPercent.innerText = "80%";
                progressBar.style.width = "80%";
                statusText.innerText = "Telegram botga uzatilmoqda...";

                const encryptedBlob = new Blob([encrypted], { type: 'text/plain' });
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', encryptedBlob, file.name + '.enc');
                formData.append('caption', `🔐 Shifrlangan fayl: \`${file.name}\`\n🛡️ Algoritm: AES-256`);
                formData.append('parse_mode', 'Markdown');

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.ok) {
                    progressPercent.innerText = "100%";
                    progressBar.style.width = "100%";
                    statusText.innerText = "Muvaffaqiyatli yuborildi!";
                    alert('Fayl muvaffaqiyatli shifrlanib, Telegram botingizga yuborildi!');
                    fileInput.value = '';
                    loadUserFiles();
                } else {
                    throw new Error(result.description || 'Telegramga yuborishda xatolik yuz berdi.');
                }

            } catch (error) {
                alert('Xatolik: ' + error.message);
                statusText.innerText = "Xatolik yuz berdi!";
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.classList.remove('opacity-50');
            }
        });

        async function loadUserFiles() {
            const secretKey = document.getElementById('secretKey').value.trim();
            if (!secretKey) {
                filesList.innerHTML = `<span class="text-[10px] text-red-400 text-center py-2">Avval maxfiy kalitni kiriting!</span>`;
                return;
            }

            filesList.innerHTML = `<span class="text-[10px] text-slate-400 text-center py-2">Yuklanmoqda...</span>`;

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates`);
                const data = await res.json();

                if (!data.ok) throw new Error("Botdan xabarlarni o'qib bo'lmadi.");

                filesList.innerHTML = '';
                let foundFiles = false;

                for (let update of data.result.reverse()) {
                    if (update.message && update.message.document) {
                        const doc = update.message.document;
                        if (doc.file_name && doc.file_name.endsWith('.enc')) {
                            foundFiles = true;
                            
                            const fileRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${doc.file_id}`);
                            const fileData = await fileRes.json();

                            if (fileData.ok) {
                                const fileUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${fileData.result.file_path}`;
                                const originalName = doc.file_name.replace('.enc', '');

                                const item = document.createElement('div');
                                item.className = "flex items-center justify-between bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs";
                                item.innerHTML = `
                                    <span class="truncate max-w-[150px] text-green-300" title="${originalName}">${originalName}</span>
                                    <button class="bg-green-600/20 hover:bg-green-600 text-green-400 hover:text-slate-950 px-2.5 py-1 rounded transition text-[10px] font-bold" onclick="decryptAndDownload('${fileUrl}', '${originalName}')">
                                        <i class="fa-solid fa-download"></i> Ochish
                                    </button>
                                `;
                                filesList.appendChild(item);
                            }
                        }
                    }
                }

                if (!foundFiles) {
                    filesList.innerHTML = `<span class="text-[10px] text-slate-500 text-center py-2">Hozircha fayllar topilmadi.</span>`;
                }

            } catch (err) {
                filesList.innerHTML = `<span class="text-[10px] text-red-400 text-center py-2">Xatolik yuz berdi.</span>`;
            }
        }

        refreshFilesBtn.addEventListener('click', loadUserFiles);

        async function decryptAndDownload(url, fileName) {
            const secretKey = document.getElementById('secretKey').value.trim();
            if (!secretKey) {
                alert('Maxfiy kalit kiritilmagan!');
                return;
            }

            try {
                const res = await fetch(url);
                const encryptedText = await res.text();

                const bytes = CryptoJS.AES.decrypt(encryptedText, secretKey);
                const decryptedString = bytes.toString(CryptoJS.enc.Utf8);

                if (!decryptedString) {
                    throw new Error("Kalit noto'g'ri!");
                }

                const blob = new Blob([bytes.toString(CryptoJS.enc.Latin1)], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
            } catch (err) {
                alert('Xatolik: Kalit xato yoki faylni shifrdan yechib bo\'lmadi!');
            }
        }
    </script>
</body>
</html>
